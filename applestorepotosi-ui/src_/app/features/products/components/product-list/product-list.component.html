<div class="product-list">
  <!-- Loading: estado de carga pasado desde el padre -->
  <div *ngIf="loading()" class="loading">
    <div class="spinner"></div>
    <p>Cargando productos...</p>
  </div>

  <!-- Error: solo si NO está cargando Y hay error -->
  <div *ngIf="error() && !loading()" class="error">
    <p>{{ error() }}</p>
    <button (click)="onRetry()" class="btn-retry">Reintentar</button>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading() && !error() && products().length === 0" class="empty">
    <p *ngIf="searchTerm() || hasFilters()">
      No se encontraron productos con los filtros aplicados.
    </p>
    <p *ngIf="!searchTerm() && !hasFilters()">
      No hay productos registrados en el sistema.
    </p>
  </div>

  <!-- Grid de productos -->
  <div *ngIf="!loading() && !error() && products().length > 0" class="products-grid">
    <div *ngFor="let product of products()" class="product-card">
      <div class="product-image-wrapper">
        <img
          [src]="product.imageUrl || '/assets/imgs/product-no-image.png'"
          [alt]="product.name"
          class="product-image"
          loading="lazy"
        />
      </div>
      <div class="product-content">
        <h5 class="product-name">{{ product.name }}</h5>
        <p class="product-price">${{ product.salePrice | number:'1.2-2' }}</p>

        <!-- Badge de estado de stock -->
        <span class="stock-status" [class]="getStockStatusClass(product)">
          {{ getStockStatusText(product) }}
        </span>

        <!-- Acciones -->
        <div *ngIf="showActions()" class="product-actions">
          <button
            class="btn btn-primary btn-sm btn-add-cart"
            (click)="onSelectProduct(product)">
            Ver Producto
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
