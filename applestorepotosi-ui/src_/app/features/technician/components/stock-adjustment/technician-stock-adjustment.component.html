<div class="card card-flush">
  <div class="card-header">
    <div class="card-title"><h3>Ajuste de Stock</h3></div>
    <div class="card-toolbar">
      <!-- BUG FIX 19: El routerLink apuntaba a '/dashboard/stock-movements'
           (módulo admin). Se reemplaza por (click) para usar onCancel()
           y mantener consistencia con el componente. -->
      <button type="button" (click)="onCancel()" class="btn btn-sm btn-light-primary">
        <i class="ki-duotone ki-arrow-left fs-2"></i>Volver
      </button>
    </div>
  </div>

  <div class="card-body pt-0">

    <!-- BUG FIX 20: Se añade alerta de error visible al usuario cuando el
         envío falla, en lugar de fallar silenciosamente. -->
    <div *ngIf="submitError" class="alert alert-danger d-flex align-items-center mb-6" role="alert">
      <i class="ki-duotone ki-information-5 fs-2 me-3 text-danger"></i>
      <span>Ocurrió un error al guardar el ajuste. Por favor, intente nuevamente.</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="row mb-6">

        <div class="col-md-6 mb-4">
          <label class="form-label required">Producto</label>
          <select formControlName="productId" class="form-select form-select-solid"
                  [class.is-invalid]="form.get('productId')?.invalid && form.get('productId')?.touched">
            <option value="" disabled>Seleccione un producto</option>
            <option *ngFor="let p of products" [value]="p._id">{{ p.name }}</option>
          </select>
          <!-- BUG FIX 21: Se añaden mensajes de validación visibles. -->
          <div class="invalid-feedback" *ngIf="form.get('productId')?.errors?.['required'] && form.get('productId')?.touched">
            Seleccione un producto.
          </div>
        </div>

        <div class="col-md-6 mb-4">
          <label class="form-label required">Nueva cantidad</label>
          <input
            type="number"
            min="0"
            formControlName="newQuantity"
            class="form-control form-control-solid"
            [class.is-invalid]="form.get('newQuantity')?.invalid && form.get('newQuantity')?.touched"
            placeholder="0">
          <div class="invalid-feedback" *ngIf="form.get('newQuantity')?.errors?.['required'] && form.get('newQuantity')?.touched">
            Ingrese una cantidad.
          </div>
          <div class="invalid-feedback" *ngIf="form.get('newQuantity')?.errors?.['min'] && form.get('newQuantity')?.touched">
            La cantidad debe ser mayor o igual a 0.
          </div>
        </div>

        <div class="col-md-6 mb-4">
          <label class="form-label required">Motivo</label>
          <select formControlName="reason" class="form-select form-select-solid">
            <option value="manual">Manual</option>
            <option value="damaged">Dañado</option>
            <option value="expired">Vencido</option>
            <option value="correction">Corrección</option>
          </select>
        </div>

        <div class="col-md-12 mb-4">
          <label class="form-label">Notas</label>
          <textarea
            formControlName="notes"
            rows="3"
            class="form-control form-control-solid"
            placeholder="Observaciones adicionales (opcional)"></textarea>
        </div>

      </div>

      <div class="d-flex justify-content-end gap-3">
        <button type="button" (click)="onCancel()" class="btn btn-light-secondary">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
          {{ submitting ? 'Guardando...' : 'Guardar ajuste' }}
        </button>
      </div>
    </form>
  </div>
</div>
