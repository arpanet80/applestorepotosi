<!-- src/app/products/pages/products-page/products-page.component.html -->
<div class="products-page">

  <!-- ========== HEADER ========== -->
  <div class="page-header">
    <div class="header-content">
      <div class="header-info">
        <h3 class="fw-bold my-2">
          Catálogo de Productos
          <span class="fs-6 text-gray-500 fw-semibold ms-1">({{ totalItems }})</span>
        </h3>
      </div>
      <div class="header-actions">
        <button *ngIf="canCreate" (click)="onCreateProduct()" class="btn btn-primary btn-sm">
          <i class="ki-duotone ki-plus fs-2 me-2"></i>Nuevo Producto
        </button>
        <button (click)="onManageProducts()" class="btn btn-secondary btn-sm">
          <i class="bi bi-gear-fill fs-2 me-2"></i>Gestión Avanzada
        </button>
        <button (click)="onRefresh()" class="btn btn-outline btn-outline-primary btn-sm" [disabled]="loading">
          <i class="bi bi-arrow-repeat fs-2"></i>Actualizar
        </button>
      </div>
    </div>
  </div>

  <!-- ========== STATS CARDS ========== -->
  <app-stats-cards [cards]="statsCards" columnClass="col-xl-3"></app-stats-cards>

  <!-- ========== FILTROS ========== -->
  <div class="card mb-6">
    <div class="card-header">
      <h3 class="card-title">Filtros Avanzados</h3>
      <div class="card-toolbar">
        <span *ngIf="hasAnyFilter()" class="text-muted me-3">
          {{ getActiveFiltersCount() }} filtro(s) activo(s)
        </span>
        <button *ngIf="hasAnyFilter()" (click)="clearAllFilters()" class="btn btn-sm btn-light-danger">
          🗑️ Limpiar filtros
        </button>
      </div>
    </div>

    <div class="card-body">
      <div class="row g-4">

        <!-- Búsqueda -->
        <!-- FIX 2: Se usa (input) que emite al Subject con debounce en el componente.
             El value binding unidireccional [value] muestra el término confirmado,
             no el que el usuario está escribiendo, evitando race conditions. -->
        <div class="col-md-4">
          <label class="form-label">Búsqueda</label>
          <input
            type="text"
            class="form-control"
            placeholder="Buscar por nombre, SKU, descripción..."
            [value]="searchTerm"
            (input)="onSearch($any($event.target).value)"
          />
        </div>

        <!-- Estado -->
        <!-- FIX 6: Se usa [(ngModel)] para binding bidireccional tipado.
             (ngModelChange) reemplaza el anti-patrón (change) + $any(). -->
        <div class="col-md-2">
          <label class="form-label">Estado</label>
          <select
            class="form-select"
            [(ngModel)]="statusFilter"
            (ngModelChange)="onStatusFilterChange($event)">
            <option value="all">Todos</option>
            <option value="active">Activos</option>
            <option value="inactive">Inactivos</option>
          </select>
        </div>

        <!-- Stock -->
        <div class="col-md-2">
          <label class="form-label">Stock</label>
          <select
            class="form-select"
            [(ngModel)]="stockFilter"
            (ngModelChange)="onStockFilterChange($event)">
            <option value="all">Todo</option>
            <option value="in-stock">En stock</option>
            <option value="low-stock">Stock bajo</option>
            <option value="out-of-stock">Sin stock</option>
            <option value="over-stock">Sobre stock</option>
          </select>
        </div>

        <!-- Categoría -->
        <!-- FIX 3: Las opciones se generan dinámicamente desde el backend.
             Los [value] son ObjectIds reales de MongoDB, no números arbitrarios. -->
        <div class="col-md-2">
          <label class="form-label">Categoría</label>
          <select
            class="form-select"
            [(ngModel)]="categoryFilter"
            (ngModelChange)="onCategoryFilterChange($event)">
            <option value="">Todas</option>
            <option *ngFor="let cat of categories" [value]="cat._id">
              {{ cat.name }}
            </option>
          </select>
          <!-- Estado vacío mientras cargan -->
          <small *ngIf="categories.length === 0" class="text-muted">Cargando...</small>
        </div>

        <!-- Marca -->
        <!-- FIX 3: Igual que categoría, opciones dinámicas desde el backend. -->
        <div class="col-md-2">
          <label class="form-label">Marca</label>
          <select
            class="form-select"
            [(ngModel)]="brandFilter"
            (ngModelChange)="onBrandFilterChange($event)">
            <option value="">Todas</option>
            <option *ngFor="let brand of brands" [value]="brand._id">
              {{ brand.name }}
            </option>
          </select>
          <small *ngIf="brands.length === 0" class="text-muted">Cargando...</small>
        </div>

      </div>
    </div>
  </div>

  <!-- ========== LISTADO DE PRODUCTOS ========== -->
  <app-product-list
    [products]="products"
    [loading]="loading"
    [error]="error"
    [showActions]="true"
    [searchTerm]="searchTerm"
    [hasFilters]="hasAnyFilter()"
    (productSelected)="onProductSelected($event)"
    (productEdit)="onProductEdit($event)"
    (productDelete)="onProductDelete($event)"
    (productToggleActive)="onProductToggleActive($event)"
    (retryLoad)="loadProducts()">
  </app-product-list>

  <!-- ========== PAGINACIÓN ========== -->
  <div *ngIf="totalPages > 1" class="pagination-section">

    <div class="items-per-page-selector">
      <label for="itemsPerPage" class="form-label me-2">Mostrar:</label>
      <!-- FIX 6: [(ngModel)] + (ngModelChange) en lugar de [ngModel] + (ngModelChange) separados -->
      <select
        id="itemsPerPage"
        class="form-select form-select-sm w-auto"
        [(ngModel)]="itemsPerPage"
        (ngModelChange)="onItemsPerPageChange($event)">
        <option *ngFor="let opt of itemsPerPageOptions" [ngValue]="opt">{{ opt }}</option>
      </select>
      <span class="ms-2 text-muted">por página</span>
    </div>

    <div class="pagination">
      <button
        class="pagination-btn"
        [disabled]="currentPage === 1"
        (click)="onPageChange(currentPage - 1)">
        ← Anterior
      </button>

      <div class="pagination-pages">
        <button
          *ngFor="let page of getPages()"
          class="page-btn"
          [class.active]="page === currentPage"
          (click)="onPageChange(page)">
          {{ page }}
        </button>
      </div>

      <button
        class="pagination-btn"
        [disabled]="currentPage === totalPages"
        (click)="onPageChange(currentPage + 1)">
        Siguiente →
      </button>
    </div>

    <div class="pagination-info">
      Mostrando {{ getDisplayedRange() }} de {{ totalItems }} productos
    </div>

  </div>

</div>
